name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-images:
    name: Source Images
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      matrix-platforms: ${{ steps.matrix-platforms.outputs.result }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine matrix
        id: matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const determineMatrix = require('./scripts/matrix.js')
            return determineMatrix()

      - name: Determine matrix with platforms
        id: matrix-platforms
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const determineMatrix = require('./scripts/matrix.js')
            const withPlatforms = true

            // Every platform is built natively on its own runner, so no QEMU.
            const runners = {
              'linux/amd64': 'ubuntu-24.04',
              'linux/arm64': 'ubuntu-24.04-arm',
            }

            const { include } = determineMatrix(withPlatforms)
            return {
              include: include.flatMap(({ image, platforms }) =>
                (platforms ?? Object.keys(runners).join(',')).split(',').map((entry) => {
                  const platform = entry.trim()
                  const runner = runners[platform]
                  if (!runner) {
                    throw new Error(`No runner configured for platform ${platform}`)
                  }
                  return { image, platform, runner }
                })
              ),
            }

  pre-check:
    name: Pre Check
    runs-on: ubuntu-24.04
    needs: source-images
    strategy:
      matrix: ${{ fromJSON(needs.source-images.outputs.matrix) }}
    outputs:
      excalidraw_changed: ${{ steps.check.outputs.excalidraw_changed }}
      homebox_changed: ${{ steps.check.outputs.homebox_changed }}
      inngest_changed: ${{ steps.check.outputs.inngest_changed }}
      pypiserver_changed: ${{ steps.check.outputs.pypiserver_changed }}
      resvg_changed: ${{ steps.check.outputs.resvg_changed }}
      sally_changed: ${{ steps.check.outputs.sally_changed }}
      typst_changed: ${{ steps.check.outputs.typst_changed }}
      wifi-card_changed: ${{ steps.check.outputs.wifi-card_changed }}
      yt-dlp_changed: ${{ steps.check.outputs.yt-dlp_changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get previous revision
        id: previous
        run: |
          if ! docker pull ghcr.io/harryzcy/${{ matrix.image }}:latest 2>/dev/null; then
            echo "No previous image found, assuming first release"
            echo "previous=HEAD^" >> $GITHUB_OUTPUT
            exit 0
          fi
          previous=$(docker inspect ghcr.io/harryzcy/${{ matrix.image }} | jq '.[0]["Config"]["Labels"]["org.opencontainers.image.revision"]')
          if [ -z "$previous" ]; then
            echo "No previous revision found"
            exit 1
          fi
          echo "previous=${previous}" >> $GITHUB_OUTPUT

      - name: Get current revision
        id: current
        run: |
          current=$(git rev-parse HEAD)
          if [ -z "$current" ]; then
            echo "No current revision found"
            exit 1
          fi
          echo "current=${current}" >> $GITHUB_OUTPUT

      - name: Check directory changed between revisions
        id: check
        run: |
          set +e
          output=$(git diff --quiet ${{ steps.previous.outputs.previous }} ${{ steps.current.outputs.current }} -- images/${{ matrix.image }})
          status="$?"
          echo "status: $status"
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "Directory images/${{ matrix.image }} changed between revisions"
            echo "${{ matrix.image }}_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Directory images/${{ matrix.image }} did not change between revisions"
            echo "${{ matrix.image }}_changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [pre-check, source-images]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-images.outputs.matrix-platforms) }}
    outputs:
      excalidraw_version: ${{ steps.version.outputs.excalidraw_version }}
      homebox_version: ${{ steps.version.outputs.homebox_version }}
      inngest_version: ${{ steps.version.outputs.inngest_version }}
      pypiserver_version: ${{ steps.version.outputs.pypiserver_version }}
      resvg_version: ${{ steps.version.outputs.resvg_version }}
      sally_version: ${{ steps.version.outputs.sally_version }}
      typst_version: ${{ steps.version.outputs.typst_version }}
      wifi-card_version: ${{ steps.version.outputs.wifi-card_version }}
      yt-dlp_version: ${{ steps.version.outputs.yt-dlp_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check if image directory changed
        id: check
        run: |
          echo '${{ toJSON(needs.pre-check.outputs) }}'
          changed=$(echo '${{ toJSON(needs.pre-check.outputs) }}' | jq -r '."${{ matrix.image }}_changed"')
          echo "changed: $changed"
          echo "changed=${changed}" >> $GITHUB_OUTPUT

      - name: Prepare
        if: steps.check.outputs.changed == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Checkout
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.check.outputs.changed == 'true'

      - name: Build
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ matrix.image }}:info

      - name: Get version
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          docker create --name info ${{ matrix.image }}:info
          docker cp info:/VERSION VERSION
          version=$(cat VERSION)
          rm VERSION
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "${{ matrix.image }}_version=${version}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        if: steps.check.outputs.changed == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/harryzcy/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha,priority=300
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag: the merge job assembles the per-platform digests
      # into a single tagged manifest list.
      - name: Build and push by digest
        id: build
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name=ghcr.io/harryzcy/{0},push-by-digest=true,name-canonical=true,push=true', matrix.image) || 'type=cacheonly' }}

      - name: Export digest
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: steps.check.outputs.changed == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Release ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: [pre-check, source-images, build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source-images.outputs.matrix-platforms) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check if image directory changed
        id: check
        run: |
          echo '${{ toJSON(needs.pre-check.outputs) }}'
          changed=$(echo '${{ toJSON(needs.pre-check.outputs) }}' | jq -r '."${{ matrix.image }}_changed"')
          echo "changed: $changed"
          echo "changed=${changed}" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          version=$(echo '${{ toJSON(needs.build.outputs) }}' | jq -r '."${{ matrix.image }}_version"')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "No version reported by the build jobs for ${{ matrix.image }}"
            exit 1
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Download digests
        if: steps.check.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        if: steps.check.outputs.changed == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/harryzcy/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha,priority=300
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: push
        if: steps.check.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/harryzcy/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          VERSION_TAG: ${{ steps.meta.outputs.version }}
        run: |
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "No digests found for ${IMAGE}"
            exit 1
          fi

          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then
              args+=(--annotation "$annotation")
            fi
          done <<< "$ANNOTATIONS"
          for digest in "${digests[@]}"; do
            args+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "No digest found for ${IMAGE}:${VERSION_TAG}"
            exit 1
          fi
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Attest build provenance
        if: steps.check.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/harryzcy/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
