name: Lint

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  super-linter:
    name: All
    uses: harryzcy/github-actions/.github/workflows/linter.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main

  spelling:
    name: Spelling
    uses: harryzcy/github-actions/.github/workflows/spelling.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main

  renovate:
    name: Renovate
    uses: harryzcy/github-actions/.github/workflows/renovate.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main
